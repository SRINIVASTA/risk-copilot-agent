name: financial_risk_semantic_model
description: Semantic model for exploring bank transactions and customer KYC risk profiling.
tables:
  - name: TRANSACTION_LEDGER
    description: Contains all record entries of financial wire transfers and transaction risk scores.
    columns:
      - name: TRANSACTION_ID
        description: Unique primary key identifier for a single transaction.
      - name: AMOUNT
        description: The total value of the transaction in INR.
      - name: COUNTRY_CODE
        description: Two-letter ISO country destination code for the transfer.
      - name: RISK_SCORE
        description: Machine learning generated value indicating fraud likelihood from 0.0 to 1.0.
  - name: ACCOUNT_MASTER
    description: Master profile records for commercial bank accounts.
    columns:
      - name: ACCOUNT_ID
        description: Unique primary key identifying a customer account.
      - name: KYC_STATUS
        description: Verification status of the account. Values can be VERIFIED or PENDING.
